<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Identificador de Gêneros Textuais</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .instrucoes {
      position: fixed;
      top: 10px;
      left: 5%;
      width: 90%;
      box-sizing: border-box;
      padding: 12px;
      background: rgba(23, 107, 77, 0.95);
      color: white;
      text-align: center;
      font-size: 14px;
      border-radius: 10px;
      z-index: 10;
    }
  </style>
</head>

<body>

  <div class="instrucoes">
    <strong>Identificador de Gêneros Textuais</strong><br>
    Aponte a câmera para um marcador para identificar o gênero textual.
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; debugUIEnabled: false;"
    renderer="logarithmicDepthBuffer: true">

    <a-marker preset="hiro">

      <a-text
        value="NOTÍCIA"
        color="#FFFFFF"
        scale="0.45 0.45 0.45"
        align="center"
        position="0 0.8 0"
        rotation="-90 0 0">
      </a-text>

      <a-text
        value="Esse gênero textual tem como principal função informar o leitor de forma rápida, clara e objetiva sobre um acontecimento real e atual."
        color="#FFFFFF"
        width="3"
        scale="0.35 0.35 0.35"
        align="center"
        position="0 0.2 0"
        rotation="-90 0 0">
      </a-text>

    </a-marker>

    <a-marker preset="kanji">

      <a-text
        value="RECEITA"
        color="#FFFFFF"
        scale="0.45 0.45 0.45"
        align="center"
        position="0 0.8 0"
        rotation="-90 0 0">
      </a-text>

      <a-text
        value="Esse gênero textual tem a função de instruir e ensinar o leitor a realizar um procedimento ou preparar um alimento."
        color="#FFFFFF"
        width="3"
        scale="0.35 0.35 0.35"
        align="center"
        position="0 0.2 0"
        rotation="-90 0 0">
      </a-text>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
