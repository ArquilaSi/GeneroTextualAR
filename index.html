<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gêneros Textuais com Realidade Aumentada</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        #instrucoes {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            z-index: 10;
            background: rgba(23, 107, 77, 0.95);
            color: white;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }

        #instrucoes h2 {
            margin: 0 0 6px;
            font-size: 17px;
        }

        #instrucoes p {
            margin: 0;
            font-size: 12px;
            line-height: 1.4;
        }
    </style>
</head>

<body>

    <div id="instrucoes">
        <h2>Gêneros Textuais com Realidade Aumentada</h2>
        <p>Aponte a câmera para um marcador para conhecer o gênero textual e sua finalidade.</p>
    </div>

    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; debugUIEnabled: false;"
        renderer="logarithmicDepthBuffer: true">

        <!-- NOTÍCIA -->
        <a-marker preset="hiro">

            <a-entity rotation="-90 0 0">

                <a-text
                    value="NOTICIA"
                    position="0 0.8 0"
                    align="center"
                    color="#176B4D"
                    font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"
                    width="2.5"
                    scale="0.65 0.65 0.65">
                </a-text>

                <a-text
                    value="Informa acontecimentos"
                    position="0 0.2 0"
                    align="center"
                    color="#176B4D"
                    font="https://cdn.aframe.io/fonts/Exo2Regular.fnt"
                    width="2.5"
                    scale="0.5 0.5 0.5">
                </a-text>

            </a-entity>

        </a-marker>

        <!-- RECEITA -->
        <a-marker preset="kanji">

            <a-entity rotation="-90 0 0">

                <a-text
                    value="RECEITA"
                    position="0 0.8 0"
                    align="center"
                    color="#176B4D"
                    font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"
                    width="2.5"
                    scale="0.65 0.65 0.65">
                </a-text>

                <a-text
                    value="Ensina a preparar algo"
                    position="0 0.2 0"
                    align="center"
                    color="#176B4D"
                    font="https://cdn.aframe.io/fonts/Exo2Regular.fnt"
                    width="2.5"
                    scale="0.5 0.5 0.5">
                </a-text>

            </a-entity>

        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>

</body>
</html>
