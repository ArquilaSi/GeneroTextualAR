<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gêneros Textuais com Realidade Aumentada</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        #instrucoes {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            z-index: 10;
            background: rgba(23, 107, 77, 0.95);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        #instrucoes h2 {
            margin: 0 0 8px;
            font-size: 20px;
        }

        #instrucoes p {
            margin: 0;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div id="instrucoes">
        <h2>Gêneros Textuais com Realidade Aumentada</h2>
        <p>
            Aponte a câmera para um dos marcadores para conhecer
            o gênero textual e sua finalidade.
        </p>
    </div>

    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; debugUIEnabled: false;"
        renderer="logarithmicDepthBuffer: true;"
    >

        <!-- Marcador para o gênero notícia -->
        
        <a-marker preset="hiro">
            <a-text
                value="NOTICIA"
                position="0 0.5 0"
                rotation="-90 0 0"
                align="center"
                color="#FFFFFF"
                width="5">
            </a-text>
        </a-marker>
```

            <a-text value="NOTICIA" position="0 1.1 0" rotation="-90 0 0" align="center" color="#FFFFFF" width="4"></a-text>
            <a-text value="Informa acontecimentos" position="0 0.8 0" rotation="-90 0 0" align="center" color="#FFFFFF" width="4"></a-text>

        </a-marker>

        <!-- Marcador para o gênero receita -->

        <a-marker preset="kanji">
            <a-text
                value="RECEITA"
                position="0 0.5 0"
                rotation="-90 0 0"
                align="center"
                color="#FFFFFF"
                width="5">
            </a-text>
        </a-marker>
        

            <a-text value="RECEITA" position="0 1.1 0" rotation="-90 0 0" align="center" color="#FFFFFF" width="4"></a-text>
            <a-text value="Ensina a preparar algo" position="0 0.8 0" rotation="-90 0 0" align="center" color="#FFFFFF" width="4"></a-text>

        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>

</body>
</html>
