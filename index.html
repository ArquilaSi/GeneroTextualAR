
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gêneros Textuais com Realidade Aumentada</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        #instrucoes {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            z-index: 10;
            background: rgba(23, 107, 77, 0.95);
            color: white;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }

        #instrucoes h2 {
            margin: 0 0 6px;
            font-size: 18px;
        }

        #instrucoes p {
            margin: 0;
            font-size: 13px;
            line-height: 1.4;
        }
    </style>
</head>

<body>

    <div id="instrucoes">
        <h2>Gêneros Textuais com Realidade Aumentada</h2>
        <p>Aponte a câmera para um marcador para conhecer o gênero textual e sua finalidade.</p>
    </div>

    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; debugUIEnabled: false;"
        renderer="logarithmicDepthBuffer: true">

        <!-- Gênero textual: notícia -->
        <a-marker preset="hiro">

            <!-- Título -->
            <a-text
                value="NOTÍCIA"
                position="0 0.65 0"
                rotation="-90 0 0"
                align="center"
                color="#FF0000"
                width="2"
                scale="0.7 0.7 0.7">
            </a-text>

            <!-- Finalidade -->
            <a-text
                value="Informa acontecimentos"
                position="0 0.25 0"
                rotation="-90 0 0"
                align="center"
                color="#FF0000"
                width="3"
                scale="0.7 0.7 0.7">
            </a-text>

        </a-marker>

        <!-- Gênero textual: receita -->
        <a-marker preset="kanji">

            <!-- Título -->
            <a-text
                value="RECEITA"
                position="0 0.65 0"
                rotation="-90 0 0"
                align="center"
                color="#FF0000"
                width="2"
                scale="0.7 0.7 0.7">
            </a-text>

            <!-- Finalidade -->
            <a-text
                value="Ensina a preparar algo"
                position="0 0.25 0"
                rotation="-90 0 0"
                align="center"
                color="#FF0000"
                width="3"
                scale="0.7 0.7 0.7">
            </a-text>

        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>

</body>
</html>
