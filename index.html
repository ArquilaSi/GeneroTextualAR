<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gêneros Textuais com Realidade Aumentada</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        #instrucoes {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            z-index: 10;
            background: rgba(23, 107, 77, 0.95);
            color: white;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }

        #instrucoes h2 {
            margin: 0 0 6px;
            font-size: 17px;
        }

        #instrucoes p {
            margin: 0;
            font-size: 12px;
            line-height: 1.4;
        }
    </style>
</head>

<body>

    <!-- INSTRUÇÕES -->
    <div id="instrucoes">
        <h2>Gêneros Textuais com Realidade Aumentada</h2>
        <p>Aponte a câmera para um marcador para conhecer o gênero textual e sua finalidade.</p>
    </div>

    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; debugUIEnabled: false;"
        renderer="logarithmicDepthBuffer: true">

        <!-- MARCADOR NOTÍCIA -->
        <a-marker preset="hiro">

            <!-- QUADRO VERDE DO TÍTULO -->
            <a-plane
                position="0 0.8 0"
                rotation="-90 0 0"
                width="1.5"
                height="0.4"
                material="shader: flat; color: #176B4D; side: double">
            </a-plane>

            <!-- TÍTULO NOTÍCIA -->
            <a-text
                value="NOTÍCIA"
                position="0 0.8 0.03"
                rotation="-90 0 0"
                align="center"
                color="#FFFFFF"
                width="3"
                scale="0.7 0.7 0.7"
                material="shader: msdf; transparent: true; depthTest: false">
            </a-text>

            <!-- QUADRO VERDE DA EXPLICAÇÃO -->
            <a-plane
                position="0 0.2 0"
                rotation="-90 0 0"
                width="2.5"
                height="1.0"
                material="shader: flat; color: #176B4D; side: double">
            </a-plane>

            <!-- EXPLICAÇÃO DA NOTÍCIA -->
            <a-text
                value="A notícia informa sobre um acontecimento real."
                position="0 0.2 0.03"
                rotation="-90 0 0"
                align="center"
                color="#FFFFFF"
                width="2.2"
                wrap-count="28"
                scale="0.5 0.5 0.5"
                material="shader: msdf; transparent: true; depthTest: false">
            </a-text>

        </a-marker>

        <!-- MARCADOR RECEITA -->
        <a-marker preset="kanji">

            <!-- QUADRO VERDE DO TÍTULO -->
            <a-plane
                position="0 0.8 0"
                rotation="-90 0 0"
                width="1.5"
                height="0.4"
                material="shader: flat; color: #176B4D; side: double">
            </a-plane>

            <!-- TÍTULO RECEITA -->
            <a-text
                value="RECEITA"
                position="0 0.8 0.03"
                rotation="-90 0 0"
                align="center"
                color="#FFFFFF"
                width="3"
                scale="0.7 0.7 0.7"
                material="shader: msdf; transparent: true; depthTest: false">
            </a-text>

            <!-- QUADRO VERDE DA EXPLICAÇÃO -->
            <a-plane
                position="0 0.2 0"
                rotation="-90 0 0"
                width="2.5"
                height="1.0"
                material="shader: flat; color: #176B4D; side: double">
            </a-plane>

            <!-- EXPLICAÇÃO DA RECEITA -->
            <a-text
                value="A receita ensina a preparar um alimento ou realizar um procedimento."
                position="0 0.2 0.03"
                rotation="-90 0 0"
                align="center"
                color="#FFFFFF"
                width="2.2"
                wrap-count="28"
                scale="0.5 0.5 0.5"
                material="shader: msdf; transparent: true; depthTest: false">
            </a-text>

        </a-marker>

        <!-- CÂMERA -->
        <a-entity camera></a-entity>

    </a-scene>

</body>
</html>
